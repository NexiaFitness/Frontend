name: Secret scan

# Gates secrets added in a push or pull request. The one-time history audit
# is separate: a full-history gate would stay red on commits that are already
# published until those blobs are removed.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  gitleaks:
    name: Gitleaks on the new commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the commits introduced here
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${BASE_SHA}..HEAD"
          fi
          gitleaks git . --redact --config .gitleaks.toml --log-opts="${RANGE}"
